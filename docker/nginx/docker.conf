server {
    http2 on;
    server_name localhost;
    server_name host.docker.internal;
    resolver 127.0.0.11 ipv6=off valid=30s;

    listen 9003 ssl default_server;
    listen [::]:9003 ssl default_server;
    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols    TLSv1.2 TLSv1.3;

    location ~ ^/auth/(?:js|realms|resources|admin).* {
        set $upstream keycloak;

        proxy_pass http://$upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin https://host.docker.internal:9003;
        #proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_buffer_size  8k;
        proxy_buffers      32 8k;
        add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; always";
        add_header X-Frame-Options SAMEORIGIN;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'self'; block-all-mixed-content; child-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'";
    }

    location /tms {
        set $webapp host.docker.internal;

        proxy_pass http://$webapp:3000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin https://$webapp:9003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_buffer_size  8k;
        proxy_buffers      32 8k;
    }

    location ~ ^/api/(.+) {
        set $upstream tms-backend;

        proxy_pass http://$upstream:8080/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        #add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
        #add_header X-Frame-Options SAMEORIGIN;
        proxy_read_timeout 300;
        proxy_buffer_size  8k;
        proxy_buffers      32 8k;
    }

    location / {
        set $upstream tms-backend;

        proxy_pass http://$upstream:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        #add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";
        #add_header X-Frame-Options SAMEORIGIN;
        proxy_read_timeout 300;
        proxy_buffer_size  8k;
        proxy_buffers      32 8k;
    }
}
