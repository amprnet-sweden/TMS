server {
    http2 on;
    server_name localhost;
    server_name host.docker.internal;
    resolver 127.0.0.11 ipv6=off valid=30s;

    listen 9003 ssl default_server;
    listen [::]:9003 ssl default_server;
    ssl_certificate /etc/nginx/certs/public.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;
    ssl_protocols    TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;

    location /tms/index.html {
        gzip_static on;
        etag on;
    }
    location /tms {
        try_files $uri $uri/ /tms/index.html;
        gzip_static on;
        etag on;
    }

    location ~ ^/auth/(?:js|realms|resources|admin).* {
        proxy_pass http://keycloak:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/(.+) {
        proxy_pass http://tms-backend:8080/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header Origin $http_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

