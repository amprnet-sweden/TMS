name: Build Frontend and Backend

on:
  pull_request:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  frontend:
    if: github.repository == 'amprnet-sweden/TMS'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      IMAGE: ghcr.io/${{ github.repository }}/tms-vue-frontend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          file: ./frontend/Dockerfile
          context: ./frontend
          #platforms: linux/amd64
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  backend:
    if: github.repository == 'amprnet-sweden/TMS'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      IMAGE: ghcr.io/${{ github.repository }}/tms-spring-boot-backend

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set release number
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> $GITHUB_ENV
      - name: Print release number
        run: echo "Building release ${{ env.RELEASE_VERSION }}"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build service
        run: ./gradlew build
      - name: Archive test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: ./build/reports/tests/test/
          retention-days: 3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and test
        uses: docker/build-push-action@v7
        with:
          file: ./backend/Dockerfile
          context: ./backend
          #platforms: linux/amd64
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: JAR=tms-backend-${{ env.RELEASE_VERSION }}.jar
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
