databaseChangeLog:
  - changeSet:
      id: cm26ke8a
      author: goeh
      labels: metadata
      comment: Incident priority
      changes:
        - createTable:
            tableName: incident_priority
            columns:
              - column:
                  name: id
                  type: char(24)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: mission_id
                  type: char(24)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: varchar(80)
              - column:
                  name: color
                  type: varchar(80)
              - column:
                  name: ctime
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: mtime
                  type: datetime

