  - changeSet:
      id: ejrn11rs
      author: goeh
      labels: auth
      comment: Foreign key constraints
      changes:
        - addForeignKeyConstraint:
            constraintName: cm4r9chh0000mbm027ojph15v
            baseTableName: comment
            baseColumnNames: incident_id
            referencedTableName: incident
            referencedColumnNames: id
            deleteCascade: true
        - addForeignKeyConstraint:
            constraintName: cm4r9eylo000nbm02tn2dtzwo
            baseTableName: incident
            baseColumnNames: service_id
            referencedTableName: service_type
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: cm4r9g781000obm02m43hhazb
            baseTableName: incident
            baseColumnNames: status_id
            referencedTableName: incident_status
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: cm4r9gagd000pbm02u3klb0wa
            baseTableName: incident
            baseColumnNames: priority_id
            referencedTableName: incident_priority
            referencedColumnNames: id

  - changeSet:
      id: kqwp2ajk
      author: goeh
      labels: mission
      comment: Add mission table
      changes:
        - createTable:
