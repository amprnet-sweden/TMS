                  name: mission_id
                  type: char(24)
                  constraints:
                    nullable: false
              - column:
                  name: sub
                  type: varchar(36)
              - column:
                  name: role
                  type: varchar(20)
              - column:
                  name: ctime
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: mtime
                  type: datetime

        - addUniqueConstraint:
            constraintName: mission_member_rel
            tableName: mission_member
            columnNames: mission_id, sub
