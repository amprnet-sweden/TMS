                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(4000)
              - column:
                  name: status
                  type: varchar(10)
                  constraints:
                    nullable: false
              - column:
                  name: icon
                  type: varchar(80)
              - column:
                  name: color
                  type: varchar(80)
              - column:
                  name: ctime
                  type: datetime
                  constraints:
                    nullable: false
              - column:
                  name: mtime
                  type: datetime

        - addUniqueConstraint:
            constraintName: mission_name
            tableName: mission
            columnNames: name

        - createTable:
            tableName: mission_member
            columns:
              - column:
                  name: id
                  type: char(24)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
