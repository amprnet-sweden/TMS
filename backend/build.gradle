plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'se.amprnet'
version = System.getenv('RELEASE_VERSION') ?: '3.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Compile with our single JDK 21 installation while retaining the existing
// Java 17 bytecode/API baseline used by the separate ARM32 Docker image.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.security:spring-security-messaging'
    implementation 'org.liquibase:liquibase-core'
    implementation 'io.github.thibaultmeyer:cuid:2.0.3'
    implementation 'org.keycloak:keycloak-admin-client:26.0.7'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client:3.5.6'
    runtimeOnly 'org.postgresql:postgresql:42.7.8'
    runtimeOnly 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mariadb:1.21.3'
    testImplementation 'org.testcontainers:postgresql:1.21.3'
    testImplementation 'com.github.dasniko:testcontainers-keycloak:3.7.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    layered {
    }
}

springBoot {
    buildInfo {
        properties {
            artifact = 'tms-backend'
            name = 'AMPRNet TMS backend'
        }
    }
}

def repo = "ghcr.io/amprnet-sweden"
def serviceName = rootProject.name
def dockerImageName = "${repo}/${serviceName}"
def imageTag = "latest"

bootBuildImage {
    imageName = "${dockerImageName}:${imageTag}"
}

task docker(dependsOn: build) {
    def jarName = "${rootProject.name}-${version}.jar"
    doLast {
        exec {
            commandLine 'docker', 'buildx', 'build', '--platform', 'linux/amd64', '--build-arg', "JAR=$jarName", '-t', "${dockerImageName}:${imageTag}", layout.projectDir
            //commandLine 'docker', 'build', '--build-arg', "JAR=$jarName", '-t', "${dockerImageName}:${imageTag}", layout.projectDir
        }
    }
}

task push(dependsOn: tasks.docker) {
    doLast {
        exec {
            commandLine 'docker', 'push', "${dockerImageName}:${imageTag}"
        }
    }
}
