---
- name: Validate Keycloak prerequisites and ownership
  ansible.builtin.import_tasks: validate.yml

- name: Install the optimized Keycloak runtime
  ansible.builtin.import_tasks: install.yml

- name: Configure and start Keycloak
  ansible.builtin.import_tasks: configure.yml

- name: Provision identities and remove bootstrap credentials
  ansible.builtin.import_tasks: provision.yml

- name: Verify the canonical application realm
  ansible.builtin.import_tasks: verify.yml

- name: Report identity readiness
  ansible.builtin.import_tasks: report.yml
