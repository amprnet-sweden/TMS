---
- name: Create deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /srv/tms
    - /srv/tms/releases

- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 86400
