---
- name: Validate frontend artifacts and HTTPS ownership
  ansible.builtin.import_tasks: validate.yml

- name: Install proxy prerequisites
  ansible.builtin.import_tasks: install.yml

- name: Configure certificates and backend Java trust
  ansible.builtin.import_tasks: tls.yml

- name: Configure and activate the frontend proxy
  ansible.builtin.import_tasks: configure.yml

- name: Verify frontend HTTPS and routing
  ansible.builtin.import_tasks: verify.yml

- name: Report HTTPS readiness
  ansible.builtin.import_tasks: report.yml
