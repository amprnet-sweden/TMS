---
- name: Validate backend prerequisites and ownership
  ansible.builtin.import_tasks: validate.yml

- name: Install the verified backend release
  ansible.builtin.import_tasks: install.yml

- name: Configure and start the backend service
  ansible.builtin.import_tasks: configure.yml

- name: Verify backend health and authenticated access
  ansible.builtin.import_tasks: verify.yml

- name: Report backend readiness
  ansible.builtin.import_tasks: report.yml
