---
- name: Build the backend with the single Java 21 installation (tests explicitly skipped)
  ansible.builtin.command:
    argv:
      - /bin/bash
      - ./gradlew
      - --no-daemon
      - --console=plain
      - --max-workers=2
      - "-Porg.gradle.java.installations.paths={{ tms_java_home }}"
      - -Porg.gradle.java.installations.auto-detect=false
      - -Porg.gradle.java.installations.auto-download=false
      - build
      - -x
      - test
    chdir: "{{ component_directory }}/backend"
  async: 3600
  poll: 15
  changed_when: true

- name: Find the executable Spring Boot JAR
  ansible.builtin.find:
    paths: "{{ component_directory }}/backend/build/libs"
    patterns: '*.jar'
    excludes: '*-plain.jar'
    file_type: file
  register: build_backend_jars

- name: Require exactly one executable JAR
  ansible.builtin.assert:
    that:
      - build_backend_jars.matched == 1

- name: Copy the executable JAR to a stable artifact name
  ansible.builtin.copy:
    src: "{{ build_backend_jars.files[0].path }}"
    dest: "{{ component_directory }}/backend/app.jar"
    remote_src: true
    mode: '0644'
