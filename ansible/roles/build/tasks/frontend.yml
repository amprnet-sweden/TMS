---
- name: Generate frontend URLs in the build copy
  ansible.builtin.template:
    src: frontend.env.j2
    dest: "{{ component_directory }}/frontend/.env.production.local"
    mode: '0644'

- name: Install the exact frontend dependency tree
  ansible.builtin.command:
    argv: ["{{ tms_node_home }}/bin/npm", ci, '--include=dev', '--no-audit', '--no-fund']
    chdir: "{{ component_directory }}/frontend"
  async: 3600
  poll: 15
  changed_when: true

- name: Build the frontend
  ansible.builtin.command:
    argv: ["{{ tms_node_home }}/bin/npm", run, build]
    chdir: "{{ component_directory }}/frontend"
  async: 3600
  poll: 15
  changed_when: true

- name: Verify that the frontend entry point was produced
  ansible.builtin.stat:
    path: "{{ component_directory }}/frontend/dist/index.html"
  register: build_frontend_index

- name: Require the frontend entry point
  ansible.builtin.assert:
    that:
      - build_frontend_index.stat.exists
      - build_frontend_index.stat.size > 0
