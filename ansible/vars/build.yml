---
tms_java_version: 25
tms_java_package: "openjdk-{{ tms_java_version }}-jdk-headless"
# Preflight accepts only Debian 13/aarch64 and Ubuntu 26.04/x86_64.
# Keep Debian package architecture names separate from Node distribution names.
tms_toolchain_architectures:
  aarch64:
    java: arm64
    node: arm64
    node_sha256: a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f
  x86_64:
    java: amd64
    node: x64
    node_sha256: df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de
tms_toolchain_architecture: "{{ tms_toolchain_architectures[ansible_facts['architecture']] }}"
tms_java_home: "/usr/lib/jvm/java-{{ tms_java_version }}-openjdk-{{ tms_toolchain_architecture.java }}"
tms_node_version: 22.23.3
tms_node_sha256: "{{ tms_toolchain_architecture.node_sha256 }}"
tms_node_distribution: "node-v{{ tms_node_version }}-linux-{{ tms_toolchain_architecture.node }}"
tms_node_home: "{{ tms_toolchain_directory }}/{{ tms_node_distribution }}"
tms_build_user: tms-build
tms_build_home: "{{ tms_build_root }}/home"
# This stage verifies packaging. Docker/Testcontainers tests are a separate run.
tms_backend_tests: skipped (native build stage; Docker is not installed)
