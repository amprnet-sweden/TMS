---
- name: Check the native installation target
  hosts: tms
  gather_facts: true
  vars_files:
    - vars/resources.yml
  tasks:
    - name: Validate the selected resource profile
      ansible.builtin.assert:
        that:
          - tms_resource_profile | default('standard') in tms_resource_profiles
        fail_msg: Select standard or pi_1gb_experimental.

    - name: Resolve resource budgets for all installation stages
      ansible.builtin.set_fact:
        tms_resources: "{{ tms_resource_profiles[tms_resource_profile | default('standard')] }}"

    - name: Require the selected operating system and architecture
      ansible.builtin.assert:
        that:
          - groups['tms'] | length == 1
          - >-
            (ansible_facts['distribution'] == 'Debian' and
             ansible_facts['distribution_major_version'] == '13' and
             ansible_facts['architecture'] == 'aarch64') or
            (ansible_facts['distribution'] == 'Ubuntu' and
             ansible_facts['distribution_version'] == '26.04' and
             ansible_facts['architecture'] == 'x86_64')
          - ansible_facts['memtotal_mb'] >= tms_resources.minimum_memory_mb
        fail_msg: "Debian 13 ARM64 or Ubuntu 26.04 x86_64 and at least {{ tms_resources.minimum_memory_mb }} MiB RAM are required for this profile."

    # Ubuntu 26.04 defaults to sudo-rs, whose prompt differs from the sudo
    # plugin's expected marker. The sudo package also provides sudo.ws.
    - name: Select traditional sudo on Ubuntu unless explicitly configured
      ansible.builtin.set_fact:
        ansible_become_exe: /usr/bin/sudo.ws
      when:
        - ansible_facts['distribution'] == 'Ubuntu'
        - ansible_become_exe is not defined

    - name: Verify privilege escalation without changing the guest
      ansible.builtin.command: /usr/bin/id -u
      become: true
      register: privileged_identity
      changed_when: false
      failed_when: >-
        privileged_identity.rc | default(1) != 0 or
        privileged_identity.stdout | default('') != '0'
      check_mode: false

    - name: Report the verified target
      ansible.builtin.debug:
        msg: >-
          SSH, Python and sudo work on {{ ansible_facts['hostname'] }}:
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }},
          {{ ansible_facts['architecture'] }}, {{ ansible_facts['memtotal_mb'] }} MiB RAM.
          This preflight check did not install packages or services.
